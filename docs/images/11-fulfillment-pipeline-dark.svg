<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 140" width="1180" height="140" fill="none" style="background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Pretendard', sans-serif;">
  <defs>
    <filter id="shadow-dark" x="-5%" y="-5%" width="110%" height="120%" filterUnits="objectBoundingBox">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748B"/>
    </marker>
    <marker id="arrow-blue-dark" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#60A5FA"/>
    </marker>
    <marker id="arrow-amber-dark" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#FBBF24"/>
    </marker>
    <marker id="arrow-green-dark" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#34D399"/>
    </marker>
  </defs>

  <!-- Step 1: 배송 옵션 선택 -->
  <g transform="translate(10, 16)" filter="url(#shadow-dark)">
    <rect width="200" height="106" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <rect x="14" y="14" width="58" height="22" rx="6" fill="#1E3A8A"/>
    <text x="43" y="29" font-size="11" font-weight="700" fill="#93C5FD" text-anchor="middle">STEP 1</text>
    <text x="14" y="58" font-size="14.5" font-weight="700" fill="#F8FAFC">① 배송 방법 선택</text>
    <text x="14" y="80" font-size="12" fill="#94A3B8">/checkout (스토어프론트)</text>
    <text x="14" y="98" font-size="11" fill="#60A5FA" font-weight="600">CJ택배 · 새벽배송 · 화물</text>
  </g>

  <!-- Connector 1 -> 2 -->
  <path d="M 216 69 L 244 69" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrow-blue-dark)"/>

  <!-- Step 2: 주문 접수 & 출고 대기 -->
  <g transform="translate(250, 16)" filter="url(#shadow-dark)">
    <rect width="200" height="106" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <rect x="14" y="14" width="70" height="22" rx="6" fill="#451A03"/>
    <text x="49" y="29" font-size="11" font-weight="700" fill="#FCD34D" text-anchor="middle">PENDING</text>
    <text x="14" y="58" font-size="14.5" font-weight="700" fill="#F8FAFC">② 주문 접수 (대기)</text>
    <text x="14" y="80" font-size="12" fill="#94A3B8">Medusa Core 주문 생성</text>
    <text x="14" y="98" font-size="11" fill="#FBBF24" font-weight="600">Status: not_fulfilled</text>
  </g>

  <!-- Connector 2 -> 3 -->
  <path d="M 456 69 L 484 69" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrow-amber-dark)"/>

  <!-- Step 3: 백오피스 출고 승인 -->
  <g transform="translate(490, 16)" filter="url(#shadow-dark)">
    <rect width="200" height="106" rx="14" fill="#0F172A" stroke="#818CF8" stroke-width="2"/>
    <rect x="14" y="14" width="66" height="22" rx="6" fill="#312E81"/>
    <text x="47" y="29" font-size="11" font-weight="700" fill="#C7D2FE" text-anchor="middle">ADMIN</text>
    <text x="14" y="58" font-size="14.5" font-weight="700" fill="#E0E7FF">③ 백오피스 출고 승인</text>
    <text x="14" y="80" font-size="12" font-weight="600" fill="#A5B4FC">Create Fulfillment</text>
    <text x="14" y="98" font-size="11" fill="#94A3B8">물류센터 재고 차감 (sloc)</text>
  </g>

  <!-- Connector 3 -> 4 -->
  <path d="M 696 69 L 724 69" stroke="#8B5CF6" stroke-width="2" marker-end="url(#arrow-green-dark)"/>

  <!-- Step 4: 운송장 라벨 등록 -->
  <g transform="translate(730, 16)" filter="url(#shadow-dark)">
    <rect width="205" height="106" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <rect x="14" y="14" width="70" height="22" rx="6" fill="#064E3B"/>
    <text x="49" y="29" font-size="11" font-weight="700" fill="#6EE7B7" text-anchor="middle">SHIPPED</text>
    <text x="14" y="58" font-size="14.5" font-weight="700" fill="#F8FAFC">④ 운송장 라벨 발급</text>
    <text x="14" y="80" font-size="12" font-weight="600" fill="#34D399">CJ 6829-4102-8891 (m)</text>
    <text x="14" y="98" font-size="11" fill="#94A3B8">Stripe PG 결제 최종 매입</text>
  </g>

  <!-- Connector 4 -> 5 -->
  <path d="M 941 69 L 969 69" stroke="#10B981" stroke-width="2" marker-end="url(#arrow-green-dark)"/>

  <!-- Step 5: 스토어프론트 추적 확인 -->
  <g transform="translate(975, 16)" filter="url(#shadow-dark)">
    <rect width="195" height="106" rx="14" fill="#064E3B" stroke="#10B981" stroke-width="2"/>
    <rect x="14" y="14" width="60" height="22" rx="6" fill="#065F46"/>
    <text x="44" y="29" font-size="11" font-weight="700" fill="#A7F3D0" text-anchor="middle">VERIFY</text>
    <text x="14" y="58" font-size="14.5" font-weight="700" fill="#ECFDF5">⑤ UI 실시간 추적</text>
    <text x="14" y="80" font-size="12" font-weight="600" fill="#6EE7B7">/checkout/success</text>
    <text x="14" y="98" font-size="11" fill="#A7F3D0">● 출고 완료 배지 표출</text>
  </g>
</svg>

