<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 140" width="1180" height="140" fill="none" style="background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Pretendard', sans-serif;">
  <defs>
    <filter id="shadow-light" x="-5%" y="-5%" width="110%" height="120%" filterUnits="objectBoundingBox">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <marker id="arrow-light" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#94A3B8"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
  </defs>

  <!-- Step 1: 배송 옵션 선택 -->
  <g transform="translate(10, 16)" filter="url(#shadow-light)">
    <rect width="200" height="106" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="14" y="14" width="58" height="22" rx="6" fill="#EFF6FF"/>
    <text x="43" y="29" font-size="11" font-weight="700" fill="#2563EB" text-anchor="middle">STEP 1</text>
    <text x="14" y="58" font-size="14.5" font-weight="700" fill="#0F172A">① 배송 방법 선택</text>
    <text x="14" y="80" font-size="12" fill="#64748B">/checkout (스토어프론트)</text>
    <text x="14" y="98" font-size="11" fill="#2563EB" font-weight="600">CJ택배 · 새벽배송 · 화물</text>
  </g>

  <!-- Connector 1 -> 2 -->
  <path d="M 216 69 L 244 69" stroke="#93C5FD" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- Step 2: 주문 접수 & 출고 대기 -->
  <g transform="translate(250, 16)" filter="url(#shadow-light)">
    <rect width="200" height="106" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="14" y="14" width="70" height="22" rx="6" fill="#FEF3C7"/>
    <text x="49" y="29" font-size="11" font-weight="700" fill="#D97706" text-anchor="middle">PENDING</text>
    <text x="14" y="58" font-size="14.5" font-weight="700" fill="#0F172A">② 주문 접수 (대기)</text>
    <text x="14" y="80" font-size="12" fill="#64748B">Medusa Core 주문 생성</text>
    <text x="14" y="98" font-size="11" fill="#D97706" font-weight="600">Status: not_fulfilled</text>
  </g>

  <!-- Connector 2 -> 3 -->
  <path d="M 456 69 L 484 69" stroke="#FCD34D" stroke-width="2" marker-end="url(#arrow-amber)"/>

  <!-- Step 3: 백오피스 출고 승인 -->
  <g transform="translate(490, 16)" filter="url(#shadow-light)">
    <rect width="200" height="106" rx="14" fill="#F8FAFC" stroke="#6366F1" stroke-width="2"/>
    <rect x="14" y="14" width="66" height="22" rx="6" fill="#EEF2FF"/>
    <text x="47" y="29" font-size="11" font-weight="700" fill="#4F46E5" text-anchor="middle">ADMIN</text>
    <text x="14" y="58" font-size="14.5" font-weight="700" fill="#312E81">③ 백오피스 출고 승인</text>
    <text x="14" y="80" font-size="12" font-weight="600" fill="#4F46E5">Create Fulfillment</text>
    <text x="14" y="98" font-size="11" fill="#64748B">물류센터 재고 차감 (sloc)</text>
  </g>

  <!-- Connector 3 -> 4 -->
  <path d="M 696 69 L 724 69" stroke="#A78BFA" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- Step 4: 운송장 라벨 등록 -->
  <g transform="translate(730, 16)" filter="url(#shadow-light)">
    <rect width="205" height="106" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="14" y="14" width="70" height="22" rx="6" fill="#DCFCE7"/>
    <text x="49" y="29" font-size="11" font-weight="700" fill="#15803D" text-anchor="middle">SHIPPED</text>
    <text x="14" y="58" font-size="14.5" font-weight="700" fill="#14532D">④ 운송장 라벨 발급</text>
    <text x="14" y="80" font-size="12" font-weight="600" fill="#16A34A">CJ 6829-4102-8891 (m)</text>
    <text x="14" y="98" font-size="11" fill="#4B5563">Stripe PG 결제 최종 매입</text>
  </g>

  <!-- Connector 4 -> 5 -->
  <path d="M 941 69 L 969 69" stroke="#6EE7B7" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- Step 5: 스토어프론트 추적 확인 -->
  <g transform="translate(975, 16)" filter="url(#shadow-light)">
    <rect width="195" height="106" rx="14" fill="#F0FDF4" stroke="#10B981" stroke-width="2"/>
    <rect x="14" y="14" width="60" height="22" rx="6" fill="#BBF7D0"/>
    <text x="44" y="29" font-size="11" font-weight="700" fill="#166534" text-anchor="middle">VERIFY</text>
    <text x="14" y="58" font-size="14.5" font-weight="700" fill="#14532D">⑤ UI 실시간 추적</text>
    <text x="14" y="80" font-size="12" font-weight="600" fill="#15803D">/checkout/success</text>
    <text x="14" y="98" font-size="11" fill="#16A34A">● 출고 완료 배지 표출</text>
  </g>
</svg>

