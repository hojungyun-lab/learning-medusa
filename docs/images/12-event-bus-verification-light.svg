    <text x="20" y="77" font-size="12" fill="#64748B">src/subscribers/ 폴더 감지 ➔ order-placed.ts, order-fulfillment-created.ts 자동 초기화 및 Redis Event Bus 리스너 등록</text>
  </g>

  <!-- Connector 1 -> 2 -->
