    <g transform="translate(266, 46)">
      <rect width="210" height="88" rx="10" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.2"/>
      <text x="14" y="25" font-size="12.5" font-weight="700" fill="#B91C1C">📡 Redis Event Bus</text>
      <text x="14" y="45" font-size="10" font-weight="600" fill="#DC2626">"order.fulfillment_created"</text>
