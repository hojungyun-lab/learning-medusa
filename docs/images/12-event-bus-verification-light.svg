      <rect x="10" y="8" width="160" height="18" rx="4" fill="#0F172A"/>
      <text x="16" y="21" font-size="9.5" font-weight="700" fill="#FCD34D">TERMINAL LOG VERIFIED</text>
      <text x="12" y="43" font-size="11" font-weight="600" fill="#1E293B">🚚 [CJ택배] 집하 EDI 전문 전송 (310ms)</text>
