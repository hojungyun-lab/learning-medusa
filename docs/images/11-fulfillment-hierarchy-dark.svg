<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 525" width="900" height="525" fill="none" style="background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Pretendard', sans-serif;">
  <defs>
    <filter id="shadow-dark" x="-5%" y="-5%" width="110%" height="115%" filterUnits="objectBoundingBox">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow-blue-dark" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#60A5FA"/>
    </marker>
    <marker id="arrow-indigo-dark" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#818CF8"/>
    </marker>
    <marker id="arrow-teal-dark" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2DD4BF"/>
    </marker>
  </defs>

  <!-- Level 1: Stock Location & Fulfillment Provider -->
  <!-- 1. Stock Location -->
  <g transform="translate(110, 20)" filter="url(#shadow-dark)">
    <rect width="360" height="84" rx="14" fill="#1E293B" stroke="#3B82F6" stroke-width="2"/>
    <rect x="14" y="12" width="105" height="20" rx="6" fill="#1E3A8A"/>
    <text x="66" y="26" font-size="11" font-weight="700" fill="#93C5FD" text-anchor="middle">STOCK LOCATION</text>
    <text x="14" y="52" font-size="15" font-weight="700" fill="#F8FAFC">🏢 ACME 서울 중앙물류센터 (m)</text>
    <text x="14" y="72" font-size="12" fill="#94A3B8">재고 실물 보관 거점 · sloc_01M6JNWX...</text>
  </g>

  <!-- Provider Link Connector -->
  <path d="M 470 62 L 530 62" stroke="#818CF8" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow-indigo-dark)"/>
  <rect x="475" y="46" width="50" height="16" rx="4" fill="#312E81"/>
  <text x="500" y="58" font-size="9" font-weight="700" fill="#C7D2FE" text-anchor="middle">LINK</text>

  <!-- 2. Fulfillment Provider -->
  <g transform="translate(540, 20)" filter="url(#shadow-dark)">
    <rect width="250" height="84" rx="14" fill="#1E293B" stroke="#6366F1" stroke-width="1.5"/>
    <rect x="14" y="12" width="80" height="20" rx="6" fill="#312E81"/>
    <text x="54" y="26" font-size="11" font-weight="700" fill="#C7D2FE" text-anchor="middle">PROVIDER</text>
    <text x="14" y="52" font-size="14.5" font-weight="700" fill="#F8FAFC">🚚 manual_manual</text>
    <text x="14" y="72" font-size="12" fill="#94A3B8">택배사 API / 수동 출고 연동</text>
  </g>

  <!-- Connector: Stock Location -> Fulfillment Set -->
  <path d="M 290 104 L 290 130 Q 290 145 315 145 L 430 145 Q 450 145 450 160 L 450 168" stroke="#60A5FA" stroke-width="2" marker-end="url(#arrow-blue-dark)"/>
  <rect x="330" y="135" width="80" height="20" rx="4" fill="#0C4A6E" stroke="#0284C7" stroke-width="1"/>
  <text x="370" y="149" font-size="10.5" font-weight="600" fill="#7DD3FC" text-anchor="middle">1:N 소유 관계</text>

  <!-- Level 2: Fulfillment Set -->
  <g transform="translate(250, 175)" filter="url(#shadow-dark)">
    <rect width="400" height="78" rx="14" fill="#1E293B" stroke="#0284C7" stroke-width="2"/>
    <rect x="14" y="12" width="115" height="20" rx="6" fill="#0C4A6E"/>
    <text x="71" y="26" font-size="11" font-weight="700" fill="#38BDF8" text-anchor="middle">FULFILLMENT SET</text>
    <text x="14" y="50" font-size="15" font-weight="700" fill="#F8FAFC">📦 ACME 국내 배송 세트 (m)</text>
    <text x="14" y="69" font-size="12" fill="#94A3B8">출고 유형: shipping (택배 및 화물 배송)</text>
  </g>

  <!-- Connector: Fulfillment Set -> Service Zone -->
  <path d="M 450 253 L 450 285" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow-blue-dark)"/>
  <rect x="410" y="258" width="80" height="18" rx="4" fill="#042F2E" stroke="#0D9488" stroke-width="1"/>
  <text x="450" y="271" font-size="10" font-weight="600" fill="#5EEAD4" text-anchor="middle">지역 설정</text>

  <!-- Level 3: Service Zone -->
  <g transform="translate(250, 292)" filter="url(#shadow-dark)">
    <rect width="400" height="78" rx="14" fill="#1E293B" stroke="#0D9488" stroke-width="2"/>
    <rect x="14" y="12" width="95" height="20" rx="6" fill="#042F2E"/>
    <text x="61" y="26" font-size="11" font-weight="700" fill="#2DD4BF" text-anchor="middle">SERVICE ZONE</text>
    <text x="14" y="50" font-size="15" font-weight="700" fill="#F8FAFC">🗺️ 대한민국 전역 (m)</text>
    <text x="14" y="69" font-size="12" fill="#94A3B8">도달 가능 지리 구역: geo_zones [KR]</text>
  </g>

  <!-- Connector: Service Zone -> 3 Shipping Options (Fork) -->
  <path d="M 450 370 L 450 395" stroke="#2DD4BF" stroke-width="2"/>
  <!-- Branch Left (Option 1) -->
  <path d="M 450 395 Q 450 405 435 405 L 175 405 Q 160 405 160 415 L 160 422" stroke="#2DD4BF" stroke-width="2" marker-end="url(#arrow-teal-dark)"/>
  <!-- Branch Center (Option 2) -->
  <path d="M 450 395 L 450 422" stroke="#2DD4BF" stroke-width="2" marker-end="url(#arrow-teal-dark)"/>
  <!-- Branch Right (Option 3) -->
  <path d="M 450 395 Q 450 405 465 405 L 725 405 Q 740 405 740 415 L 740 422" stroke="#2DD4BF" stroke-width="2" marker-end="url(#arrow-teal-dark)"/>

  <!-- Level 4: Shipping Options (3종) -->
  <!-- Option 1: Standard Parcel -->
  <g transform="translate(30, 428)" filter="url(#shadow-dark)">
    <rect width="260" height="88" rx="12" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
    <rect x="12" y="10" width="62" height="18" rx="4" fill="#334155"/>
    <text x="43" y="23" font-size="10" font-weight="700" fill="#CBD5E1" text-anchor="middle">표준 배송</text>
    <text x="12" y="44" font-size="13.5" font-weight="700" fill="#F8FAFC">🚛 CJ대한통운 일반 택배 (m)</text>
    <text x="12" y="63" font-size="11.5" font-weight="700" fill="#60A5FA">3,000 KRW</text>
    <text x="12" y="78" font-size="10.5" fill="#94A3B8">영업일 2~3일 소요 (전국 기본)</text>
  </g>

  <!-- Option 2: Coldchain Dawn -->
  <g transform="translate(320, 428)" filter="url(#shadow-dark)">
    <rect width="260" height="88" rx="12" fill="#064E3B" stroke="#10B981" stroke-width="2"/>
    <rect x="12" y="10" width="62" height="18" rx="4" fill="#065F46"/>
    <text x="43" y="23" font-size="10" font-weight="700" fill="#A7F3D0" text-anchor="middle">새벽 특급</text>
    <text x="12" y="44" font-size="13.5" font-weight="700" fill="#ECFDF5">❄️ F&amp;B 신선 새벽 배송 (m)</text>
    <text x="12" y="63" font-size="11.5" font-weight="700" fill="#34D399">6,000 KRW</text>
    <text x="12" y="78" font-size="10.5" fill="#A7F3D0">익일 07시 전 도착 (원두 신선도)</text>
  </g>

  <!-- Option 3: B2B Freight Free -->
  <g transform="translate(610, 428)" filter="url(#shadow-dark)">
    <rect width="260" height="88" rx="12" fill="#3B0764" stroke="#A855F7" stroke-width="2"/>
    <rect x="12" y="10" width="62" height="18" rx="4" fill="#581C87"/>
    <text x="43" y="23" font-size="10" font-weight="700" fill="#E9D5FF" text-anchor="middle">대량 무료</text>
    <text x="12" y="44" font-size="13.5" font-weight="700" fill="#FAF5FF">📦 B2B 화물 무료 직배송 (m)</text>
    <text x="12" y="63" font-size="11.5" font-weight="700" fill="#C084FC">0 KRW (무료 배송)</text>
    <text x="12" y="78" font-size="10.5" fill="#D8B4FE">10박스 이상 용차 파레트 배송</text>
  </g>
</svg>

