<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 140" width="1160" height="140" fill="none" style="background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Pretendard', sans-serif;">
  <defs>
    <filter id="shadow-dark" x="-5%" y="-5%" width="110%" height="120%" filterUnits="objectBoundingBox">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748B"/>
    </marker>
    <marker id="arrow-dark-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#60A5FA"/>
    </marker>
    <marker id="arrow-dark-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#34D399"/>
    </marker>
    <marker id="arrow-dark-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#A78BFA"/>
    </marker>
  </defs>

  <!-- Step 1: Cart -->
  <g transform="translate(10, 16)" filter="url(#shadow-dark)">
    <rect width="195" height="106" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <rect x="14" y="14" width="56" height="22" rx="6" fill="#0F172A"/>
    <text x="42" y="29" font-size="11" font-weight="700" fill="#94A3B8" text-anchor="middle">STEP 1</text>
    <text x="14" y="58" font-size="15" font-weight="700" fill="#F8FAFC">① 장바구니 (/cart)</text>
    <text x="14" y="80" font-size="12" fill="#94A3B8">[주문서 작성 진행 →]</text>
    <circle cx="170" cy="25" r="3" fill="#64748B"/>
  </g>

  <!-- Connector 1 -> 2 -->
  <path d="M 211 69 L 235 69" stroke="#475569" stroke-width="2" marker-end="url(#arrow-dark)"/>

  <!-- Step 2: Checkout Form -->
  <g transform="translate(241, 16)" filter="url(#shadow-dark)">
    <rect width="195" height="106" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <rect x="14" y="14" width="56" height="22" rx="6" fill="#312E81"/>
    <text x="42" y="29" font-size="11" font-weight="700" fill="#A5B4FC" text-anchor="middle">STEP 2</text>
    <text x="14" y="58" font-size="15" font-weight="700" fill="#F8FAFC">② 체크아웃 (/checkout)</text>
    <text x="14" y="80" font-size="12" fill="#94A3B8">배송지 &amp; 결제수단 선택</text>
    <text x="14" y="98" font-size="11" fill="#818CF8" font-weight="600">Stripe PG · B2B 외상</text>
  </g>

  <!-- Connector 2 -> 3 -->
  <path d="M 442 69 L 466 69" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrow-dark-blue)"/>

  <!-- Step 3: Pay Action -->
  <g transform="translate(472, 16)" filter="url(#shadow-dark)">
    <rect width="195" height="106" rx="14" fill="#0F172A" stroke="#3B82F6" stroke-width="2"/>
    <rect x="14" y="14" width="60" height="22" rx="6" fill="#1E3A8A"/>
    <text x="44" y="29" font-size="11" font-weight="700" fill="#93C5FD" text-anchor="middle">ACTION</text>
    <text x="14" y="58" font-size="15" font-weight="700" fill="#60A5FA">③ 결제 승인 요청</text>
    <text x="14" y="80" font-size="12" font-weight="600" fill="#93C5FD">[🔒 115,500원 결제]</text>
    <text x="14" y="98" font-size="11" fill="#94A3B8">Server Action 호출</text>
  </g>

  <!-- Connector 3 -> 4 -->
  <path d="M 673 69 L 697 69" stroke="#10B981" stroke-width="2" marker-end="url(#arrow-dark-green)"/>

  <!-- Step 4: Success -->
  <g transform="translate(703, 16)" filter="url(#shadow-dark)">
    <rect width="195" height="106" rx="14" fill="#064E3B" fill-opacity="0.3" stroke="#10B981" stroke-width="2"/>
    <rect x="14" y="14" width="70" height="22" rx="6" fill="#064E3B"/>
    <text x="49" y="29" font-size="11" font-weight="700" fill="#6EE7B7" text-anchor="middle">COMPLETE</text>
    <text x="14" y="58" font-size="15" font-weight="700" fill="#34D399">④ 주문 완료</text>
    <text x="14" y="80" font-size="12" font-weight="600" fill="#6EE7B7">/checkout/success</text>
    <text x="14" y="98" font-size="11" fill="#94A3B8">주문번호 4 &amp; 출고안내</text>
  </g>

  <!-- Connector 4 -> 5 -->
  <path d="M 904 69 L 928 69" stroke="#8B5CF6" stroke-width="2" marker-end="url(#arrow-dark-purple)"/>

  <!-- Step 5: Stripe Dashboard -->
  <g transform="translate(934, 16)" filter="url(#shadow-dark)">
    <rect width="215" height="106" rx="14" fill="#2E1065" fill-opacity="0.3" stroke="#8B5CF6" stroke-width="2"/>
    <rect x="14" y="14" width="74" height="22" rx="6" fill="#4C1D95"/>
    <text x="51" y="29" font-size="11" font-weight="700" fill="#C4B5FD" text-anchor="middle">PG VERIFY</text>
    <text x="14" y="58" font-size="14.5" font-weight="700" fill="#C4B5FD">⑤ Stripe 원장 검증</text>
    <text x="14" y="80" font-size="12" font-weight="600" fill="#DDD6FE">Transactions &gt; Payments</text>
    <text x="14" y="98" font-size="11" fill="#A78BFA">₩105,000 (Uncaptured)</text>
  </g>
</svg>
