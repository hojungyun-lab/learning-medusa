name: Deploy to Railway

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 22 런타임 설정
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Railway CLI 설치
        run: npm install -g @railway/cli

      - name: Railway 프로덕션 배포 실행
        run: railway up --service acme-medusa-backend --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

